name: Run Continuous Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci:
    # Referenced by path so this repo always exercises the reusable workflow as it
    # exists on the current branch, rather than the last published tag.
    uses: ./.github/workflows/reusable-ci.yml
    with:
      docker-tags: |
        example_project_dev-web:latest
        example_project_dev-worker:latest

name: Reusable Continuous Integration

# Shared CI pipeline for the ADIT / RADIS / adit-radis-shared Django projects.
# Callers only differ in which development images they build, so that is the sole input.
# The uv version below is intentionally a literal: Renovate tracks `astral-sh/setup-uv`
# `with.version` and would lose sight of it if it were a workflow input default.

on:
  workflow_call:
    inputs:
      docker-tags:
        description: "Newline-separated development image tags to build and load."
        required: true
        type: string

jobs:
  ci:
    runs-on: "ubuntu-latest"
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.3"
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: "pyproject.toml"
      - name: Install dependencies
        run: uv sync
      - name: Configure environment
        run: uv run cli init-workspace
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and cache Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          target: development
          load: true
          tags: ${{ inputs.docker-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start Docker containers
        run: uv run cli compose-up -- --detach --no-build
      - name: Run linting
        # https://github.com/actions/runner/issues/241#issuecomment-745902718
        shell: 'script -q -e -c "bash {0}"'
        run: uv run cli lint
      - name: Run tests
        shell: 'script -q -e -c "bash {0}"'
        run: uv run cli test -- --cov
      - name: Stop Docker containers
        if: ${{ always() }}
        run: uv run cli compose-down

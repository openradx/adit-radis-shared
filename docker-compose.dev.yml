x-app: &default-app
  build:
    target: development
  pull_policy: build
  environment:
    DJANGO_SETTINGS_MODULE: example_project.settings.development
  develop:
    watch:
      - action: sync
        path: .
        target: /app
        ignore:
          - .git/
          - .venv/
          - node_modules/
      - action: rebuild
        path: ./pyproject.toml

services:
  init:
    profiles:
      - never

  web:
    <<: *default-app
    image: example_project_dev-web:latest
    ports:
      - ${WEB_DEV_PORT:-8000}:8000
      - ${REMOTE_DEBUGGING_PORT:-5678}:5678
    command: >
      bash -c "
        cd example_project;
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        ./manage.py migrate &&
        ./manage.py create_superuser &&
        ./manage.py create_example_users &&
        ./manage.py create_example_groups &&
        ./manage.py create_example_jobs &&
        ./manage.py retry_stalled_jobs &&
        ./manage.py runserver 0.0.0.0:8000
      "

  worker:
    <<: *default-app
    image: example_project_dev-worker:latest
    command: >
      bash -c "
        cd example_project;
        wait-for-it -s postgres.local:5432 -t ${WAIT_POSTGRES_TIMEOUT:-180} &&
        ./manage.py bg_worker -l debug --autoreload
      "

  postgres:
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - ${POSTGRES_DEV_PORT:-5432}:5432

  # Identity provider for developing and manually testing the OIDC login. Only
  # started when the "keycloak" profile is enabled, so that it stays out of the
  # way of the test runs on the CI server.
  # Reachable under the same URL from the browser and from inside the containers,
  # so that the issuer in the discovery document matches on both sides. This
  # requires "127.0.0.1 keycloak.local" in the /etc/hosts file of the host.
  keycloak:
    profiles:
      - keycloak
    image: quay.io/keycloak/keycloak:26.7.2@sha256:6efbadc00f0ed0237610becf11f4101b9c3ad8edf08a5b70c97aa4154ed436ec
    hostname: keycloak.local
    command: start-dev --import-realm --http-port=${KEYCLOAK_DEV_PORT:-8090}
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://keycloak.local:${KEYCLOAK_DEV_PORT:-8090}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - ${KEYCLOAK_DEV_PORT:-8090}:${KEYCLOAK_DEV_PORT:-8090}
